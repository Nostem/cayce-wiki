name: Build and deploy Quartz to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "quartz-production"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Apply large-vault client performance patches
        run: node scripts/patch-quartz-performance.mjs

      - name: Build Quartz
        run: npx quartz build
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"

      - name: Split and shrink search/graph indexes
        run: node scripts/strip-content-index.mjs public/static/contentIndex.json 180 120 4 8

      - name: Prepare Vercel Build Output API artifact
        run: node scripts/prepare-vercel-output.mjs

      - name: Install Vercel CLI
        run: npm install --global vercel@59.3.0

      - name: Deploy prebuilt site to Vercel
        run: vercel deploy --prebuilt --prod --yes --archive=tgz --token "$VERCEL_TOKEN" --scope noizy1234-1628s-projects
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_QGe1wJf02vnl2A2sjKQV0LTq
          VERCEL_PROJECT_ID: prj_qoOG7HRXdkOWcjRhMBdfMPFnVdSl
