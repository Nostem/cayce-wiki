name: Verify Quartz site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "quartz-verification"
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Apply large-vault client performance patches
        run: node scripts/patch-quartz-performance.mjs

      - name: Build Quartz
        run: npx quartz build
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"

      - name: Split and shrink search/graph indexes
        run: node scripts/strip-content-index.mjs public/static/contentIndex.json 180 120 4 8
