name: Build and deploy Quartz to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "quartz-production"
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: verify
    if: ${{ github.ref == 'refs/heads/main' }}
    # Keep ubuntu-22.04 (no documented larger runner for this org); raise heap instead.
    runs-on: ubuntu-22.04
    # Safety ceiling only — primary fix is heap + concurrency + no git dates + fewer catalog pages.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          # CreatedModifiedDate no longer uses git; shallow clone is enough.
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build optimized Quartz site for Vercel
        run: npm run vercel-build
        env:
          NODE_OPTIONS: "--max-old-space-size=12288"
          VERCEL_PROJECT_PRODUCTION_URL: cayce-wiki.vercel.app

      - name: Prepare Vercel Build Output API artifact
        run: node scripts/prepare-vercel-output.mjs

      - name: Install Vercel CLI
        run: npm install --global vercel@59.3.0

      - name: Deploy prebuilt site to Vercel
        run: vercel deploy --prebuilt --prod --yes --archive=tgz --token "$VERCEL_TOKEN" --scope noizy1234-1628s-projects
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_QGe1wJf02vnl2A2sjKQV0LTq
          VERCEL_PROJECT_ID: prj_qoOG7HRXdkOWcjRhMBdfMPFnVdSl
