name: Verify Quartz

on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Quartz plugin index
        run: npm run install-plugins
      - name: Check types
        run: |
          set +e
          out=$(npx tsc --noEmit 2>&1)
          code=$?
          echo "$out"
          if [ $code -eq 0 ]; then exit 0; fi
          quartz_errs=$(echo "$out" | grep -E 'error TS' | grep -v 'plugins/' || true)
          if [ -n "$quartz_errs" ]; then
            echo "$quartz_errs"
            exit 1
          fi
          echo "Ignoring TypeScript errors under plugins/ (built via esbuild)."
          exit 0
      - name: Run full test suite
        run: npm test
